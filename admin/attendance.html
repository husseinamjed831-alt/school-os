<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الحضور — School OS</title>
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <script type="module">
    import { requireRole } from "/js/lib/auth.js";
    import { mountShell } from "/js/lib/shell.js";
    import { listClasses } from "/js/api/classes.js";
    import { listSections } from "/js/api/sections.js";
    import { getDailyAttendanceOverview } from "/js/api/attendance.js";
    import { guard, escapeHtml } from "/js/lib/utils.js";

    const profile = await requireRole(["school_admin", "branch_admin"]);
    const content = mountShell(profile, "attendance");

    content.innerHTML = `
      <h1>نظرة يومية على الحضور</h1>
      <p class="text-muted" style="margin-bottom:20px;">ملخص حالة الحضور لكل شعبة في يوم محدد</p>
      <div class="card" style="margin-bottom:20px;">
        <div class="grid grid-3">
          <div class="field" style="margin-bottom:0;">
            <label for="date-input">التاريخ</label>
            <input type="date" id="date-input" />
          </div>
          <div class="field" style="margin-bottom:0;">
            <label for="class-filter">الصف</label>
            <select id="class-filter"><option value="">كل الصفوف</option></select>
          </div>
          <div class="field" style="margin-bottom:0;">
            <label for="section-filter">الشعبة</label>
            <select id="section-filter"><option value="">كل الشعب</option></select>
          </div>
        </div>
      </div>
      <div id="overview-wrap"></div>
    `;

    const dateInput = document.getElementById("date-input");
    dateInput.value = new Date().toISOString().slice(0, 10);

    const classFilter = document.getElementById("class-filter");
    const sectionFilter = document.getElementById("section-filter");

    const allClasses = (await guard(() => listClasses())) ?? [];
    classFilter.insertAdjacentHTML(
      "beforeend",
      allClasses.map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("")
    );

    let allSections = (await guard(() => listSections())) ?? [];
    function renderSectionOptions() {
      const classId = classFilter.value;
      const sections = classId ? allSections.filter((s) => s.class_id === classId) : allSections;
      sectionFilter.innerHTML =
        `<option value="">كل الشعب</option>` +
        sections.map((s) => `<option value="${s.id}">${escapeHtml(s.classes?.name ?? "")} - ${escapeHtml(s.name)}</option>`).join("");
    }
    renderSectionOptions();

    async function renderOverview() {
      const wrap = document.getElementById("overview-wrap");
      const date = dateInput.value;
      if (!date) {
        wrap.innerHTML = "";
        return;
      }
      wrap.innerHTML = `<p class="text-muted">جارِ التحميل...</p>`;

      const rows =
        (await guard(() =>
          getDailyAttendanceOverview(date, {
            classId: classFilter.value || undefined,
            sectionId: sectionFilter.value || undefined,
          })
        )) ?? [];

      if (rows.length === 0) {
        wrap.innerHTML = `<div class="empty-state"><div class="empty-state-title">لا توجد بيانات لهذا اليوم</div><p>لا يوجد طلاب مسجّلون في الشعب المطابقة، أو لم يبدأ أي معلم بتسجيل الحضور بعد</p></div>`;
        return;
      }

      const totals = rows.reduce(
        (acc, r) => {
          acc.present += r.present;
          acc.absent += r.absent;
          acc.late += r.late;
          acc.excused += r.excused;
          acc.not_recorded += r.not_recorded;
          acc.total += r.total;
          return acc;
        },
        { present: 0, absent: 0, late: 0, excused: 0, not_recorded: 0, total: 0 }
      );

      wrap.innerHTML = `
        <div class="grid grid-4" style="margin-bottom:20px;">
          <div class="stat-card"><div><div class="stat-value">${totals.total}</div><div class="stat-label">إجمالي الطلاب</div></div></div>
          <div class="stat-card"><div><div class="stat-value" style="color:var(--success);">${totals.present}</div><div class="stat-label">حاضر</div></div></div>
          <div class="stat-card"><div><div class="stat-value" style="color:var(--danger);">${totals.absent}</div><div class="stat-label">غائب</div></div></div>
          <div class="stat-card"><div><div class="stat-value">${totals.not_recorded}</div><div class="stat-label">لم يُسجَّل بعد</div></div></div>
        </div>
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>الصف</th><th>الشعبة</th><th>حاضر</th><th>غائب</th><th>متأخر</th><th>مجاز</th><th>لم يُسجَّل</th><th>الإجمالي</th></tr></thead>
            <tbody>
              ${rows
                .map(
                  (r) => `
                <tr>
                  <td>${escapeHtml(r.class_name)}</td>
                  <td>${escapeHtml(r.section_name)}</td>
                  <td><span class="badge badge-present">${r.present}</span></td>
                  <td>${r.absent > 0 ? `<span class="badge badge-absent">${r.absent}</span>` : "0"}</td>
                  <td>${r.late > 0 ? `<span class="badge badge-late">${r.late}</span>` : "0"}</td>
                  <td>${r.excused > 0 ? `<span class="badge badge-excused">${r.excused}</span>` : "0"}</td>
                  <td>${r.not_recorded > 0 ? `<span class="badge badge-neutral">${r.not_recorded}</span>` : "0"}</td>
                  <td>${r.total}</td>
                </tr>`
                )
                .join("")}
            </tbody>
          </table>
        </div>
      `;
    }

    classFilter.addEventListener("change", () => {
      renderSectionOptions();
      renderOverview();
    });
    sectionFilter.addEventListener("change", renderOverview);
    dateInput.addEventListener("change", renderOverview);

    await renderOverview();
  </script>
</body>
</html>
