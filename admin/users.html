<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المستخدمون — School OS</title>
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>حساب مستخدم جديد</h3>
        <button class="modal-close" id="modal-close" aria-label="إغلاق">✕</button>
      </div>
      <form id="user-form">
        <div class="field"><label for="f-name">الاسم الكامل</label><input id="f-name" required /></div>
        <div class="field"><label for="f-email">البريد الإلكتروني</label><input type="email" id="f-email" required /></div>
        <div class="field"><label for="f-password">كلمة المرور المبدئية</label><input type="password" id="f-password" required minlength="8" /></div>
        <div class="field"><label for="f-role">الدور</label>
          <select id="f-role" required>
            <option value="teacher">معلم</option>
            <option value="branch_admin" id="role-option-branch-admin">مدير فرع</option>
            <option value="parent">ولي أمر</option>
            <option value="student">طالب (بحساب دخول)</option>
          </select>
        </div>
        <div class="field"><label for="f-phone">رقم الهاتف (اختياري)</label><input id="f-phone" /></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="modal-cancel">إلغاء</button>
          <button type="submit" class="btn btn-primary" id="submit-btn">إنشاء الحساب</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module">
    import { requireRole } from "/js/lib/auth.js";
    import { mountShell } from "/js/lib/shell.js";
    import { listUsers, createUserAccount, deactivateUser } from "/js/api/users.js";
    import { guard, showToast, escapeHtml } from "/js/lib/utils.js";

    const profile = await requireRole(["school_admin", "branch_admin"]);
    const content = mountShell(profile, "users");

    // branch_admin cannot create another branch_admin — hide that option.
    if (profile.role === "branch_admin") {
      document.getElementById("role-option-branch-admin")?.remove();
    }

    const ROLE_LABEL = {
      super_admin: "مدير المنصة",
      school_admin: "مدير المدرسة",
      branch_admin: "مدير فرع",
      teacher: "معلم",
      student: "طالب",
      parent: "ولي أمر",
    };

    content.innerHTML = `
      <div class="flex-between" style="margin-bottom:20px;">
        <div>
          <h1>المستخدمون</h1>
          <p class="text-muted">إنشاء حسابات المعلمين ومديري الفروع وأولياء الأمور</p>
        </div>
        <button class="btn btn-primary" id="add-btn">+ حساب جديد</button>
      </div>
      <div class="field" style="max-width:240px; margin-bottom:18px;">
        <select id="role-filter">
          <option value="">كل الأدوار</option>
          <option value="teacher">معلم</option>
          <option value="branch_admin">مدير فرع</option>
          <option value="parent">ولي أمر</option>
          <option value="student">طالب</option>
        </select>
      </div>
      <div id="table-wrap"></div>
    `;

    const overlay = document.getElementById("modal-overlay");
    const form = document.getElementById("user-form");
    document.getElementById("add-btn").addEventListener("click", () => overlay.classList.add("is-open"));
    document.getElementById("modal-close").addEventListener("click", closeModal);
    document.getElementById("modal-cancel").addEventListener("click", closeModal);
    overlay.addEventListener("click", (e) => { if (e.target === overlay) closeModal(); });
    function closeModal() {
      overlay.classList.remove("is-open");
      form.reset();
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById("submit-btn");
      submitBtn.disabled = true;
      submitBtn.textContent = "جارِ الإنشاء...";

      const payload = {
        full_name: document.getElementById("f-name").value.trim(),
        email: document.getElementById("f-email").value.trim(),
        password: document.getElementById("f-password").value,
        role: document.getElementById("f-role").value,
        phone: document.getElementById("f-phone").value.trim() || undefined,
      };
      if (profile.role === "branch_admin") payload.branch_id = profile.branch_id;

      const result = await guard(() => createUserAccount(payload));
      submitBtn.disabled = false;
      submitBtn.textContent = "إنشاء الحساب";

      if (result) {
        showToast("تم إنشاء الحساب بنجاح", "success");
        closeModal();
        await renderTable();
      }
    });

    async function renderTable() {
      const wrap = document.getElementById("table-wrap");
      const role = document.getElementById("role-filter").value;
      const users = (await guard(() => listUsers({ role: role || undefined }))) ?? [];
      const filtered = users.filter((u) => u.role !== "super_admin" && u.role !== "school_admin");

      if (filtered.length === 0) {
        wrap.innerHTML = `<div class="empty-state"><div class="empty-state-title">لا يوجد مستخدمون</div></div>`;
        return;
      }

      wrap.innerHTML = `
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>الاسم</th><th>الدور</th><th>الهاتف</th><th>الحالة</th><th></th></tr></thead>
            <tbody>
              ${filtered
                .map(
                  (u) => `
                <tr>
                  <td>${escapeHtml(u.full_name)}</td>
                  <td><span class="badge badge-primary">${ROLE_LABEL[u.role] ?? u.role}</span></td>
                  <td>${escapeHtml(u.phone ?? "—")}</td>
                  <td><span class="badge ${u.is_active ? "badge-success" : "badge-neutral"}">${u.is_active ? "نشط" : "معطل"}</span></td>
                  <td>${u.is_active ? `<button class="btn btn-danger btn-sm" data-deactivate="${u.id}">تعطيل</button>` : ""}</td>
                </tr>`
                )
                .join("")}
            </tbody>
          </table>
        </div>
      `;

      wrap.querySelectorAll("[data-deactivate]").forEach((btn) =>
        btn.addEventListener("click", async () => {
          if (!confirm("هل تريد تعطيل هذا الحساب؟")) return;
          const result = await guard(() => deactivateUser(btn.dataset.deactivate));
          if (result) {
            showToast("تم تعطيل الحساب", "success");
            await renderTable();
          }
        })
      );
    }

    document.getElementById("role-filter").addEventListener("change", renderTable);
    await renderTable();
  </script>
</body>
</html>
