<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تسجيل الدخول — School OS</title>
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-logo">S</div>
      <h1 class="auth-title">School OS</h1>
      <p class="auth-subtitle">سجل الدخول للوصول إلى لوحة التحكم</p>

      <div class="auth-error" id="login-error"></div>

      <form id="login-form">
        <div class="field">
          <label for="email">البريد الإلكتروني</label>
          <input type="email" id="email" name="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">كلمة المرور</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary" id="login-submit" style="width:100%;">تسجيل الدخول</button>
      </form>

      <p class="text-muted" style="text-align:center; font-size:13px; margin-top:18px;">
        معلم جديد ولديك كود تفعيل؟ <a href="/activate.html">فعّل حسابك من هنا</a>
      </p>
      <p class="text-muted" style="text-align:center; font-size:13px; margin-top:8px;">
        مدرسة جديدة؟ <a href="/register.html">سجّل مدرستك من هنا</a>
      </p>
    </div>
  </div>

  <script type="module">
    import { login, homeForRole, getMyProfile } from "/js/lib/auth.js";

    const form = document.getElementById("login-form");
    const errorBox = document.getElementById("login-error");
    const submitBtn = document.getElementById("login-submit");

    // Already logged in? skip the form.
    getMyProfile().then((profile) => {
      if (profile) window.location.href = homeForRole(profile.role);
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.remove("is-visible");
      submitBtn.disabled = true;
      submitBtn.textContent = "جارِ الدخول...";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        const { profile } = await login(email, password);
        window.location.href = homeForRole(profile.role);
      } catch (err) {
        errorBox.textContent = err.message || "تعذر تسجيل الدخول";
        errorBox.classList.add("is-visible");
        submitBtn.disabled = false;
        submitBtn.textContent = "تسجيل الدخول";
      }
    });
  </script>
</body>
</html>
