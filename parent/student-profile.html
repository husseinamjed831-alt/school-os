<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ملف الطالب — School OS</title>
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <script type="module">
    import { requireRole } from "/js/lib/auth.js";
    import { mountShell } from "/js/lib/shell.js";
    import { renderStudentProfile } from "/js/lib/student-profile-view.js";

    const profile = await requireRole(["parent"]);
    const content = mountShell(profile, "dashboard");

    const studentId = new URLSearchParams(window.location.search).get("id");
    if (!studentId) {
      content.innerHTML = `<div class="empty-state"><div class="empty-state-title">لم يتم تحديد طالب</div></div>`;
    } else {
      content.innerHTML = `<a href="/parent/dashboard.html" class="text-muted" style="display:inline-block; margin-bottom:16px;">← رجوع</a><div id="profile-root"></div>`;
      // Risk score stays staff-only by product decision (fn_can_view_risk_score
      // denies it server-side too). Behavior records ARE shared with parents.
      // RLS independently blocks a parent from opening a child that isn't theirs.
      await renderStudentProfile(document.getElementById("profile-root"), studentId, {
        includeStaffSections: false,
        includeBehavior: true,
      });
    }
  </script>
</body>
</html>
