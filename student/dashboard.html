<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الطالب — School OS</title>
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <script type="module">
    import { requireRole } from "/js/lib/auth.js";
    import { mountShell } from "/js/lib/shell.js";
    import { getMyStudentRecord } from "/js/api/students.js";
    import { listMyScheduleToday } from "/js/api/schedule.js";
    import { renderStudentProfile } from "/js/lib/student-profile-view.js";
    import { guard, escapeHtml } from "/js/lib/utils.js";

    const profile = await requireRole(["student"]);
    const content = mountShell(profile, "dashboard");

    const myRecord = await guard(() => getMyStudentRecord());

    if (!myRecord) {
      content.innerHTML = `
        <h1>مرحباً، ${escapeHtml(profile.full_name)}</h1>
        <div class="card"><div class="empty-state">
          <div class="empty-state-title">حسابك غير مرتبط بسجل طالب بعد</div>
          <p>تواصل مع إدارة المدرسة لربط حسابك بملفك الدراسي</p>
        </div></div>`;
    } else {
      content.innerHTML = `
        <h1>مرحباً، ${escapeHtml(profile.full_name)}</h1>
        <p class="text-muted" style="margin-bottom:20px;">درجاتك وحضورك وملاحظات معلميك</p>
        <div class="card" style="margin-bottom:20px;">
          <div class="card-title">جدولي اليوم</div>
          <div id="today-wrap"></div>
        </div>
        <div id="profile-root"></div>`;

      const todayWrap = document.getElementById("today-wrap");
      const todaySlots = (await guard(() => listMyScheduleToday())) ?? [];
      todayWrap.innerHTML =
        todaySlots.length === 0
          ? `<p class="text-muted" style="font-size:13px;">لا توجد حصص مجدولة اليوم</p>`
          : `<div class="flex gap-8" style="flex-wrap:wrap;">${todaySlots
              .map(
                (s) => `
            <div class="badge badge-primary" style="padding:8px 14px; font-size:13px;">
              الحصة ${s.period}: ${escapeHtml(s.subjects?.name ?? "")}${s.subjects?.teachers?.profiles?.full_name ? " — " + escapeHtml(s.subjects.teachers.profiles.full_name) : ""}
            </div>`
              )
              .join("")}</div>`;

      await renderStudentProfile(document.getElementById("profile-root"), myRecord.id, { includeStaffSections: false });
    }
  </script>
</body>
</html>
