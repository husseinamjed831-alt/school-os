<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الحضور — School OS</title>
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <script type="module">
    import { requireRole } from "/js/lib/auth.js";
    import { mountShell } from "/js/lib/shell.js";
    import { listMySubjects } from "/js/api/subjects.js";
    import { listSections } from "/js/api/sections.js";
    import { getSectionAttendanceForDate, bulkSaveAttendance } from "/js/api/attendance.js";
    import { guard, showToast, escapeHtml } from "/js/lib/utils.js";

    const profile = await requireRole(["teacher"]);
    const content = mountShell(profile, "attendance");

    const STATUS_LABEL = { present: "حاضر", absent: "غائب", late: "متأخر", excused: "مجاز" };
    const STATUS_BADGE = { present: "badge-present", absent: "badge-absent", late: "badge-late", excused: "badge-excused" };

    content.innerHTML = `
      <h1>تسجيل الحضور</h1>
      <p class="text-muted" style="margin-bottom:20px;">اختر الشعبة والتاريخ ثم سجّل حالة كل طالب</p>
      <div class="card" style="margin-bottom:20px;">
        <div class="grid grid-2">
          <div class="field" style="margin-bottom:0;">
            <label for="section-select">الشعبة</label>
            <select id="section-select"><option value="">اختر شعبة...</option></select>
          </div>
          <div class="field" style="margin-bottom:0;">
            <label for="date-input">التاريخ</label>
            <input type="date" id="date-input" />
          </div>
        </div>
      </div>
      <div id="roster-wrap"></div>
    `;

    const dateInput = document.getElementById("date-input");
    dateInput.value = new Date().toISOString().slice(0, 10);

    const mySubjects = (await guard(() => listMySubjects())) ?? [];
    const myClassIds = [...new Set(mySubjects.map((s) => s.class_id))];
    const allSections = (await guard(() => listSections())) ?? [];
    const mySections = allSections.filter((s) => myClassIds.includes(s.class_id));

    const sectionSelect = document.getElementById("section-select");
    if (mySections.length === 0) {
      document.getElementById("roster-wrap").innerHTML = `<div class="empty-state"><div class="empty-state-title">لا توجد شعب مسندة إليك بعد</div><p>تواصل مع إدارة المدرسة لتعيين المواد التي تدرّسها</p></div>`;
    } else {
      sectionSelect.insertAdjacentHTML(
        "beforeend",
        mySections.map((s) => `<option value="${s.id}">${escapeHtml(s.classes?.name ?? "")} - ${escapeHtml(s.name)}</option>`).join("")
      );
    }

    async function renderRoster() {
      const wrap = document.getElementById("roster-wrap");
      const sectionId = sectionSelect.value;
      const date = dateInput.value;
      if (!sectionId || !date) {
        wrap.innerHTML = "";
        return;
      }

      const roster = (await guard(() => getSectionAttendanceForDate(sectionId, date))) ?? [];
      if (roster.length === 0) {
        wrap.innerHTML = `<div class="empty-state"><div class="empty-state-title">لا يوجد طلاب في هذه الشعبة</div></div>`;
        return;
      }

      wrap.innerHTML = `
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>الطالب</th><th>الحالة</th></tr></thead>
            <tbody>
              ${roster
                .map(
                  (r) => `
                <tr data-student-id="${r.student_id}">
                  <td>${escapeHtml(r.full_name)}</td>
                  <td class="flex gap-8" style="flex-wrap:wrap;">
                    ${Object.entries(STATUS_LABEL)
                      .map(
                        ([value, label]) => `
                      <button type="button" class="btn btn-sm status-btn ${r.status === value ? "btn-primary" : "btn-ghost"}" data-status="${value}">${label}</button>`
                      )
                      .join("")}
                  </td>
                </tr>`
                )
                .join("")}
            </tbody>
          </table>
        </div>
        <div class="flex-between" style="margin-top:16px;">
          <p class="text-muted">الجميع "حاضر" افتراضياً — عدّل حالة أي طالب ثم احفظ</p>
          <button class="btn btn-success" id="save-btn">حفظ الحضور</button>
        </div>
      `;

      const state = new Map(roster.map((r) => [r.student_id, r.status]));

      wrap.querySelectorAll("tr[data-student-id]").forEach((row) => {
        const studentId = row.dataset.studentId;
        row.querySelectorAll(".status-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            state.set(studentId, btn.dataset.status);
            row.querySelectorAll(".status-btn").forEach((b) => {
              b.classList.toggle("btn-primary", b === btn);
              b.classList.toggle("btn-ghost", b !== btn);
            });
          });
        });
      });

      document.getElementById("save-btn").addEventListener("click", async (e) => {
        const btn = e.currentTarget;
        // Every student in the roster always has a status now (defaulted
        // to "present" by getSectionAttendanceForDate) — save the whole
        // roster, not just the ones a teacher happened to click.
        const records = [...state.entries()].map(([student_id, status]) => ({ student_id, status }));
        btn.disabled = true;
        btn.textContent = "جارِ الحفظ...";
        const result = await guard(() =>
          bulkSaveAttendance({ school_id: profile.school_id, date, recorded_by: profile.id, records })
        );
        btn.disabled = false;
        btn.textContent = "حفظ الحضور";
        if (result) showToast("تم حفظ الحضور بنجاح", "success");
      });
    }

    sectionSelect.addEventListener("change", renderRoster);
    dateInput.addEventListener("change", renderRoster);
  </script>
</body>
</html>
