<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة المعلم — School OS</title>
  <link rel="stylesheet" href="/css/variables.css" />
  <link rel="stylesheet" href="/css/base.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>
  <script type="module">
    import { requireRole } from "/js/lib/auth.js";
    import { mountShell } from "/js/lib/shell.js";
    import { listMySubjects } from "/js/api/subjects.js";
    import { listSections } from "/js/api/sections.js";
    import { getSectionAttendanceRate, getSectionGradeSummary } from "/js/api/analytics.js";
    import { listMyTeachingToday } from "/js/api/schedule.js";
    import { supabase } from "/js/lib/supabase-client.js";
    import { guard, escapeHtml } from "/js/lib/utils.js";

    const profile = await requireRole(["teacher"]);
    const content = mountShell(profile, "dashboard");

    content.innerHTML = `
      <h1>مرحباً، ${escapeHtml(profile.full_name)}</h1>
      <p class="text-muted" style="margin-bottom:24px;">نظرة عامة على شعبك ومهامك اليوم</p>
      <div class="card" style="margin-bottom:24px;">
        <div class="card-title">حصص اليوم</div>
        <div id="today-wrap"></div>
      </div>
      <div id="sections-wrap" class="grid grid-3" style="margin-bottom:24px;"></div>
      <div class="card">
        <div class="card-title">طلاب بحاجة إلى متابعة</div>
        <div class="card-subtitle">مرتّبون حسب عدد التقييمات غير المسلّمة ضمن شعبك</div>
        <div id="attention-wrap"></div>
      </div>
      <div class="flex gap-12" style="margin-top:24px; flex-wrap:wrap;">
        <a class="btn btn-ghost" href="/teacher/attendance.html">تسجيل الحضور</a>
        <a class="btn btn-ghost" href="/teacher/assessments.html">التقييمات والدرجات</a>
      </div>
    `;

    const todayWrap = document.getElementById("today-wrap");
    const todaySlots = (await guard(() => listMyTeachingToday())) ?? [];
    todayWrap.innerHTML =
      todaySlots.length === 0
        ? `<p class="text-muted" style="font-size:13px;">لا توجد حصص مجدولة لك اليوم</p>`
        : `<div class="flex gap-8" style="flex-wrap:wrap;">${todaySlots
            .map(
              (s) => `
          <div class="badge badge-primary" style="padding:8px 14px; font-size:13px;">
            الحصة ${s.period}: ${escapeHtml(s.subjects?.name ?? "")} — ${escapeHtml(s.sections?.classes?.name ?? "")} ${escapeHtml(s.sections?.name ?? "")}
          </div>`
            )
            .join("")}</div>`;

    const mySubjects = (await guard(() => listMySubjects())) ?? [];
    const myClassIds = [...new Set(mySubjects.map((s) => s.class_id))];
    const allSections = (await guard(() => listSections())) ?? [];
    const mySections = allSections.filter((s) => myClassIds.includes(s.class_id));

    const sectionsWrap = document.getElementById("sections-wrap");
    if (mySections.length === 0) {
      sectionsWrap.innerHTML = `<div class="card"><div class="empty-state"><div class="empty-state-title">لا توجد شعب مسندة إليك بعد</div><p>تواصل مع إدارة المدرسة لتعيين المواد التي تدرّسها</p></div></div>`;
    } else {
      const cards = await Promise.all(
        mySections.map(async (s) => {
          const rate = await guard(() => getSectionAttendanceRate(s.id));
          return `
            <div class="card">
              <div class="card-title">${escapeHtml(s.classes?.name ?? "")} - ${escapeHtml(s.name)}</div>
              <div class="card-subtitle">نسبة الحضور اليوم</div>
              <div class="progress" style="margin-bottom:8px;">
                <div class="progress-bar ${rate == null ? "" : rate < 75 ? "danger" : rate < 90 ? "warning" : "success"}" style="width:${rate ?? 0}%;"></div>
              </div>
              <div class="text-muted" style="font-size:13px;">${rate == null ? "لم يُسجَّل حضور بعد اليوم" : rate + "%"}</div>
            </div>`;
        })
      );
      sectionsWrap.innerHTML = cards.join("");
    }

    // "Needs attention": students taught by this teacher with the most
    // missing assessments. RLS already scopes assessment_scores to
    // students this teacher actually teaches (fn_teaches_student).
    const attentionWrap = document.getElementById("attention-wrap");
    const missingRows = await guard(async () => {
      const { data, error } = await supabase
        .from("assessment_scores")
        .select("student_id, students(full_name)")
        .eq("is_missing", true);
      if (error) throw error;
      return data;
    });

    if (!missingRows || missingRows.length === 0) {
      attentionWrap.innerHTML = `<div class="empty-state"><div class="empty-state-title">لا يوجد طلاب بحاجة لمتابعة حالياً</div></div>`;
    } else {
      const counts = new Map();
      for (const row of missingRows) {
        const key = row.student_id;
        const entry = counts.get(key) ?? { id: key, name: row.students?.full_name ?? "—", count: 0 };
        entry.count += 1;
        counts.set(key, entry);
      }
      const top = [...counts.values()].sort((a, b) => b.count - a.count).slice(0, 8);
      attentionWrap.innerHTML = `
        <div class="table-wrap">
          <table class="table">
            <thead><tr><th>الطالب</th><th>تقييمات غير مسلّمة</th></tr></thead>
            <tbody>
              ${top.map((t) => `<tr><td><a href="/admin/student-profile.html?id=${t.id}">${escapeHtml(t.name)}</a></td><td><span class="badge badge-warning">${t.count}</span></td></tr>`).join("")}
            </tbody>
          </table>
        </div>`;
    }
  </script>
</body>
</html>
